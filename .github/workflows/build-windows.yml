name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packaging/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller==6.11.1

      - name: PyInstaller build
        run: pyinstaller packaging/exam_system.spec --noconfirm --clean

      - name: Create zip
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item packaging\启动考试系统.bat dist\ExamSystem\启动考试系统.bat -Force
          Compress-Archive -Path "dist\ExamSystem\*" -DestinationPath "release\ExamSystem.zip" -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamSystem-Windows
          path: |
            dist/ExamSystem/
            release/ExamSystem.zip
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.8
          name: 微机教室考试系统 v1.2.8
          body: |
            ## 下载说明

            解压 **ExamSystem.zip** 到 Windows 教师机，双击 **ExamSystem.exe** 即可启动。

            程序会自动选择空闲端口（优先 **18765**），放行防火墙，并自动打开浏览器。

            ### v1.2.8
            - 打字对照文章禁止选中、复制和粘贴到输入框
            - 修复考试中滚动鼠标滚轮会立刻提交试卷
            - 最近活跃和心跳时间按本地时区显示

            ### v1.2.7（启动加速）
            - 修复占用端口时健康检查长时间卡住导致「启动不动」
            - 冷启动数据库种子使用预计算密码哈希，显著加快首次就绪
            - 启动界面显示等待进度，防火墙放行与服务启动并行

            ### v1.2.6（大规模学生测试）
            - 学生无需账号：登录页输入姓名即可进入
            - 四个教师账号：teacher1~teacher4 / teacher123
            - 教师控制台实时显示在线学生，并可发布考试 / 发起打字测试
            - 登录页去除所有账号提示信息

            ### 登录方式
            | 角色 | 方式 |
            |------|------|
            | 学生 | 输入姓名 |
            | 教师 | teacher1~teacher4 / teacher123 |
          files: release/ExamSystem.zip
          make_latest: true
