name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packaging/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller==6.11.1

      - name: PyInstaller build
        run: pyinstaller packaging/exam_system.spec --noconfirm --clean

      - name: Create zip
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item packaging\启动考试系统.bat dist\ExamSystem\启动考试系统.bat -Force
          Compress-Archive -Path "dist\ExamSystem\*" -DestinationPath "release\ExamSystem.zip" -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamSystem-Windows
          path: |
            dist/ExamSystem/
            release/ExamSystem.zip
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: 微机教室考试系统 v1.2.2
          body: |
            ## 下载说明

            解压 **ExamSystem.zip** 到 Windows 教师机，双击 **ExamSystem.exe** 即可启动。

            浏览器请访问：`http://127.0.0.1:8000`

            ### v1.2.2 修复
            - 修复 exe 点击后一直启动不了（网络探测超时、端口预绑定、子线程信号处理器）
            - 已运行实例自动复用，避免重复启动失败
            - 发布考试后学生端可正常看到题目（详情接口回传题目内容且不含答案）
            - 打字练习改为左选右打：左侧选择/开始，右侧加大对照文章与输入框

            ### 默认账号
            | 角色 | 用户名 | 密码 |
            |------|--------|------|
            | 管理员 | admin | admin123 |
            | 教师 | teacher | teacher123 |
            | 学生 | student01~05 | 123456 |
          files: release/ExamSystem.zip
          make_latest: true
