name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packaging/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller==6.11.1

      - name: PyInstaller build
        run: pyinstaller packaging/exam_system.spec --noconfirm --clean

      - name: Create zip
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item packaging\启动考试系统.bat dist\ExamSystem\启动考试系统.bat -Force
          Compress-Archive -Path "dist\ExamSystem\*" -DestinationPath "release\ExamSystem.zip" -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamSystem-Windows
          path: |
            dist/ExamSystem/
            release/ExamSystem.zip
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.5
          name: 微机教室考试系统 v1.2.5
          body: |
            ## 下载说明

            解压 **ExamSystem.zip** 到 Windows 教师机，双击 **ExamSystem.exe** 即可启动。

            程序会自动选择空闲端口（优先 **18765**），放行防火墙，并自动打开浏览器。

            ### v1.2.5
            - 打字练习素材与教师账号绑定：教师只管理自己的素材，学生只看见管理本班教师的素材
            - 教师端「打字练习统计」可添加/编辑/删除本账号练习内容
            - 课堂打字测试只能使用自己创建的文章

            ### 默认账号
            | 角色 | 用户名 | 密码 |
            |------|--------|------|
            | 管理员 | admin | admin123 |
            | 教师 | teacher | teacher123 |
            | 学生 | student01~05 | 123456 |
          files: release/ExamSystem.zip
          make_latest: true
