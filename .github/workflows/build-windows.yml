name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packaging/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read release version
        id: release
        shell: pwsh
        run: |
          $launcher = Get-Content packaging/launcher.py -Raw
          $installer = Get-Content packaging/installer.iss -Raw
          if ($launcher -notmatch '(?m)^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "APP_VERSION is missing from packaging/launcher.py"
          }
          $version = $Matches[1]
          if ($installer -notmatch ('(?m)^#define MyAppVersion "' + [regex]::Escape($version) + '"')) {
            throw "The installer and launcher versions must match"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          $tag = git ls-remote origin "refs/tags/v$version" "refs/tags/v$version^{}"
          if ($LASTEXITCODE -ne 0) { throw "Could not check release tag v$version" }
          $commit = ($tag | Select-Object -Last 1) -split '\s+' | Select-Object -First 1
          "publish=$(-not $commit -or $commit -eq $env:GITHUB_SHA)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller==6.11.1

      - name: PyInstaller build
        run: pyinstaller packaging/exam_system.spec --noconfirm --clean

      - name: Package portable ZIP and Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "packaging/启动考试系统.bat" "dist/ExamSystem/启动考试系统.bat" -Force
          Compress-Archive -Path "dist/ExamSystem/*" -DestinationPath "release/ExamSystem.zip" -Force
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $compiler) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
            $compiler = Get-Command ISCC.exe -ErrorAction Stop
          }
          Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile packaging/ChineseSimplified.isl
          & $compiler.Source /DUseChineseMessages packaging/installer.iss
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path release/ExamSystem-Setup.exe)) {
            throw "Windows installer was not generated"
          }

      - name: Smoke test the installed EXE
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "ExamSystem-smoke"
          $setup = Start-Process release/ExamSystem-Setup.exe -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", ('/DIR="{0}"' -f $installDir)
          ) -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)" }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "ExamSystem-smoke-data"
          $port = 18765
          $server = Start-Process (Join-Path $installDir "ExamSystem.exe") -ArgumentList "--serve $port" -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 45 -and -not $server.HasExited; $attempt++) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 2
                $login = Invoke-WebRequest "http://127.0.0.1:$port/login" -TimeoutSec 2
                $healthy = $health.status -eq "ok" -and $login.StatusCode -eq 200
                if ($healthy) { break }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) { throw "Installed EXE did not serve the API and login page" }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
            $log = Join-Path $env:APPDATA "微机教室考试系统/launcher.log"
            if (-not $healthy -and (Test-Path $log)) { Get-Content $log }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamSystem-Windows
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 微机教室考试系统 v${{ steps.release.outputs.version }}
          body: |
            - **ExamSystem-Setup.exe**：Windows 安装程序。
            - **ExamSystem.zip**：便携版。解压整个压缩包后运行 ExamSystem.exe。

            本版支持管理员管理、分配和删除班级，学生使用姓名和密码登录，新增账号自动用姓名生成用户名。首次登录或教师重置密码后，学生须先修改初始密码。
          files: |
            release/ExamSystem-Setup.exe
            release/ExamSystem.zip
          fail_on_unmatched_files: true
          make_latest: true
